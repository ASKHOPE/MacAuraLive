<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Aurora Borealis 4K Shader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030614; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, dpr;
        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Stars
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.7,
                size: Math.random() * 1.8 + 0.5,
                alpha: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.02 + 0.005
            });
        }

        let time = 0;

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                const tw = (Math.sin(time * star.speed * 50) + 1) / 2;
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * tw);
                ctx.beginPath();
                ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawAuroraLayer(colorStops, heightOffset, speedMult, amplitude, frequency) {
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            for (let x = 0; x <= width; x += 10) {
                const y1 = Math.sin(x * frequency + time * speedMult) * amplitude;
                const y2 = Math.cos(x * frequency * 0.5 - time * speedMult * 0.7) * (amplitude * 0.6);
                const y3 = Math.sin((x + time * 100) * 0.002) * (amplitude * 0.4);
                const y = height * heightOffset + y1 + y2 + y3;
                ctx.lineTo(x, y);
            }
            
            ctx.lineTo(width, height);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, height * (heightOffset - 0.3), 0, height);
            colorStops.forEach(stop => grad.addColorStop(stop.offset, stop.color));
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function animate() {
            time += 0.015;
            ctx.clearRect(0, 0, width, height);

            // Background Deep Space Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#02020a');
            bgGrad.addColorStop(0.5, '#070f26');
            bgGrad.addColorStop(1, '#020512');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            drawStars();

            // Aurora Ribbons
            ctx.globalCompositeOperation = 'screen';

            // Ribbon 1 - Deep Violet & Cyan
            drawAuroraLayer([
                { offset: 0, color: 'rgba(0, 242, 254, 0)' },
                { offset: 0.3, color: 'rgba(0, 242, 254, 0.35)' },
                { offset: 0.6, color: 'rgba(79, 172, 254, 0.25)' },
                { offset: 1, color: 'rgba(138, 43, 226, 0)' }
            ], 0.35, 0.8, 60, 0.003);

            // Ribbon 2 - Emerald Green Light
            drawAuroraLayer([
                { offset: 0, color: 'rgba(0, 255, 170, 0)' },
                { offset: 0.35, color: 'rgba(0, 255, 170, 0.45)' },
                { offset: 0.7, color: 'rgba(0, 180, 216, 0.25)' },
                { offset: 1, color: 'rgba(0, 50, 100, 0)' }
            ], 0.45, 1.2, 80, 0.002);

            // Ribbon 3 - Bright Neon Teal
            drawAuroraLayer([
                { offset: 0, color: 'rgba(0, 230, 118, 0)' },
                { offset: 0.4, color: 'rgba(0, 230, 118, 0.5)' },
                { offset: 0.75, color: 'rgba(0, 229, 255, 0.3)' },
                { offset: 1, color: 'rgba(15, 23, 42, 0)' }
            ], 0.52, 0.9, 50, 0.004);

            ctx.globalCompositeOperation = 'source-over';

            // Distant Mountains Silhouette
            ctx.fillStyle = '#01030a';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 20) {
                const mY = height - (Math.sin(x * 0.003) * 60 + Math.cos(x * 0.008) * 40 + Math.sin(x * 0.02) * 15 + 80);
                ctx.lineTo(x, mY);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
