<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - 3D Particle Wave 4K</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, dpr;
        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const numCols = 65;
        const numRows = 40;
        let count = 0;

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Background Glow
            const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height) * 0.8);
            bgGrad.addColorStop(0, '#0a1128');
            bgGrad.addColorStop(1, '#02040a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            count += 0.03;

            const colGap = width / (numCols - 15);
            const rowGap = (height * 0.7) / numRows;

            for (let ix = 0; ix < numCols; ix++) {
                for (let iy = 0; iy < numRows; iy++) {
                    const x = (ix - numCols / 2) * colGap + width / 2;
                    const yOffset = (Math.sin(ix * 0.25 + count) * 40) + (Math.sin(iy * 0.3 + count * 1.2) * 40);
                    const y = (iy * rowGap) + (height * 0.35) + yOffset;
                    
                    const scale = 0.5 + (iy / numRows) * 1.8;
                    const radius = (1.5 + Math.sin(ix * 0.2 + count) * 1) * scale;
                    
                    const hue = (ix * 4 + iy * 3 + count * 20) % 360;
                    ctx.fillStyle = `hsla(${hue}, 90%, 65%, ${0.3 + (iy / numRows) * 0.6})`;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
